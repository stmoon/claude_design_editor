<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Claude Design Editor</title>
<link rel="stylesheet" href="/_app/editor.css">
</head>
<body>
<header class="bar">
  <strong class="brand">Claude Design Editor</strong>
  <select id="deck" title="열 파일"></select>

  <span class="sep"></span>

  <label class="lay">레이아웃
    <select id="layout" title="이 장의 레이아웃">
      <option value="bottom">글 위 · 그림 아래</option>
      <option value="right">글 왼쪽 · 그림 오른쪽</option>
      <option value="left">그림 왼쪽 · 글 오른쪽</option>
      <option value="top">그림 위 · 글 아래</option>
      <option value="text">글만</option>
      <option value="media">그림만</option>
    </select>
  </label>

  <label class="lay">열
    <button data-act="cols-" type="button">-</button>
    <output id="cols">1</output>
    <button data-act="cols+" type="button">+</button>
  </label>

  <button data-act="add" type="button">그림 추가</button>

  <span class="sep"></span>

  <label class="chk"><input type="checkbox" id="autosave" checked> 자동 저장</label>
  <button data-act="save" type="button" class="primary">저장</button>
  <button data-act="saveas" type="button">다른 이름으로 저장</button>
  <span class="status" id="status"></span>
</header>

<main class="split" id="split">
  <aside class="rail" id="railPane">
    <iframe id="rail" title="슬라이드 목록"></iframe>
  </aside>
  <div class="grip" id="grip" title="드래그로 폭 조절"></div>
  <section class="stage" id="stagePane">
    <iframe id="stage" title="슬라이드"></iframe>
  </section>
</main>

<input type="file" id="file" accept="image/*" hidden>
<script src="/_app/editor.js"></script>
</body>
</html>
