<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Claude Design Editor</title>
<link rel="stylesheet" href="/_app/editor.css">
</head>
<body>
<header class="bar">
  <strong class="brand">Claude Design Editor</strong>
  <select id="deck" title="열 파일"></select>
  <span class="keys" title="PageUp / PageDown 슬라이드 이동 · Ctrl+S 저장 · Ctrl+Z 되돌리기">PgUp / PgDn</span>

  <span class="sep"></span>

  <div class="lay lay-pick">
    <button data-act="pick" type="button" class="lay-btn" title="레이아웃 선택">
      <span class="lay-ico" id="layIcon"></span><span id="layName">레이아웃</span>
    </button>
    <div class="lay-menu" id="layMenu" hidden></div>
  </div>

  <label class="lay">열
    <button data-act="cols-" type="button">-</button>
    <output id="cols">1</output>
    <button data-act="cols+" type="button">+</button>
  </label>

  <button data-act="add" type="button">그림 추가</button>
  <button data-act="undo" type="button" title="되돌리기 (Ctrl+Z)" disabled>되돌리기</button>

  <span class="sep"></span>

  <label class="chk"><input type="checkbox" id="autosave" checked> 자동 저장</label>
  <button data-act="save" type="button" class="primary" title="저장 (Ctrl+S)">저장</button>
  <button data-act="saveas" type="button">다른 이름으로 저장</button>
  <span class="status" id="status"></span>
</header>

<main class="split" id="split">
  <aside class="rail" id="railPane">
    <iframe id="rail" title="슬라이드 목록"></iframe>
  </aside>
  <div class="grip" id="grip" title="드래그로 폭 조절"></div>
  <section class="stage" id="stagePane">
    <iframe id="stage" title="슬라이드"></iframe>
  </section>
</main>

<input type="file" id="file" accept="image/*" hidden>
<script src="/_app/editor.js"></script>
</body>
</html>
